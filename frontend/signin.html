
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAIN BASE FOUNDATION — SIGN IN</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .signin-card {
            width: min(100% - 32px, 520px);
            margin: 56px auto;
            padding: 32px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            box-shadow: 0 16px 48px #0f172a12;
        }

        .signin-card h1 {
            margin: 10px 0;
            font-size: 28px;
            color: #123b82;
        }

        .signin-card .form-group {
            margin: 18px 0;
        }

        .signin-card label {
            display: block;
            margin-bottom: 7px;
        }

        .signin-card input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font: inherit;
            box-sizing: border-box;
        }

        .signin-card button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #155eef;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .signin-card button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .signin-message {
            margin-top: 16px;
            overflow-wrap: anywhere;
        }

        .signin-note {
            color: #475569;
            font-size: 14px;
            margin: 12px 0;
        }
    </style>
</head>

<body>
    <main class="auth-page">
        <section class="signin-card">

            <div class="auth-brand">
                MAIN BASE FOUNDATION
            </div>

            <h1>SIGN IN</h1>

            <p>
                Access your MAIN BASE FOUNDATION account
            </p>

            <form id="signInForm">

                <div class="form-group">
                    <label for="signInUsername">
                        USERNAME
                    </label>

                    <input
                        id="signInUsername"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signInPassword">
                        PASSWORD
                    </label>

                    <input
                        id="signInPassword"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button
                    id="signInSubmit"
                    type="submit"
                >
                    SIGN IN
                </button>

                <div
                    id="signInMessage"
                    class="signin-message"
                    role="alert"
                    aria-live="polite"
                ></div>

            </form>

            <p class="signin-note">
                Sign in using the username and password associated
                with your account.
            </p>

            <div class="auth-footer">
                <a href="signup.html">
                    DON'T HAVE AN ACCOUNT? CREATE ACCOUNT
                </a>
                <br>
                <a href="index.html">
                    ← BACK TO MAIN BASE FOUNDATION
                </a>
            </div>

        </section>
    </main>

    <script src="sign-in.js"></script>
</body>
</html>
