<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MAIN BASE FOUNDATION — SIGN IN</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <div class="auth-brand">
                    MAIN BASE FOUNDATION
                </div>

                <h1>SIGN IN</h1>

                <p>
                    Access your MAIN BASE FOUNDATION account
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        USERNAME
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    id="loginSubmit"
                    type="submit"
                >
                    SIGN IN
                </button>


                <div
                    id="loginMessage"
                    role="alert"
                    aria-live="polite"
                ></div>

            </form>


            <div class="auth-footer">

                <a href="index.html">
                    ← BACK TO MAIN BASE FOUNDATION
                </a>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>
</html>
