<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mukti Mahal</title>

    <link rel="stylesheet" href="/frontend/mukti-mahal.css">
</head>

<body>

    <main id="mukti-mahal">

        <canvas id="mahal-canvas"></canvas>

        <section id="hud">
            <div class="brand">MUKTI MAHAL</div>

            <div class="status">
                <span id="runtime-status">MUKTI MAHAL</span>
            </div>

            <div class="instructions">
                <strong>W A S D</strong> — Move
                <br>
                <strong>Arrow Keys</strong> — Move
                <br>
                <strong>E</strong> — Interact
            </div>
        </section>

        <section id="interaction-panel" class="hidden">
            <div id="interaction-title"></div>
            <div id="interaction-description"></div>
            <button id="close-interaction">CLOSE</button>
        </section>

    </main>

    <script src="/frontend/mukti-mahal.js"></script>

</body>
</html>
