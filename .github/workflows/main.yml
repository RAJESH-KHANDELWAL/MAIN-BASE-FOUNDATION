name: Main Foundation Backend Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-boot-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run MAIN BASE FOUNDATION boot test
        run: |
          python -m backend.main
