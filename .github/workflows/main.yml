name: Main Foundation Backend Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-boot-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: |
          python -m compileall backend

      - name: Run MAIN BASE FOUNDATION boot test
        run: |
          python -m backend.main

      - name: Run pytest
        run: |
          pytest -q

      - name: Start FastAPI
        run: |
          nohup python start.py > fastapi.log 2>&1 &
          echo $! > fastapi.pid

      - name: Check FastAPI health
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/health; then
              echo "FASTAPI HEALTH CHECK: PASS"
              exit 0
            fi
            sleep 2
          done

          echo "FASTAPI HEALTH CHECK: FAILED"
          cat fastapi.log
          exit 1

      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f fastapi.pid ]; then
            kill "$(cat fastapi.pid)" || true
          fi

      - name: Run business engine integration test
        run: |
          python - <<'PY'
          from backend.engines.leads_business import LeadsBusinessEngine, LeadStatus
          from backend.engines.sales_business import SalesBusinessEngine, SalesStatus
          from backend.engines.customer_business import CustomerBusinessEngine
          from backend.engines.work_business import WorkBusinessEngine, WorkStatus, PaymentStatus

          leads = LeadsBusinessEngine()

          lead = leads.create_lead(
              lead_id="LEAD-001",
              business_name="TEST BUSINESS",
              category="DIGITAL SERVICES",
              location="JAIPUR",
              website="https://example.com",
              public_contact="test@example.com",
              source="PUBLIC_BUSINESS_DATA",
          )

          assert lead.status == LeadStatus.NEW

          leads.verify_lead("LEAD-001")
          leads.update_status("LEAD-001", LeadStatus.QUALIFIED)

          assert leads.get_lead("LEAD-001").status == LeadStatus.QUALIFIED

          sales = SalesBusinessEngine()

          opportunity = sales.create_opportunity(
              opportunity_id="OPP-001",
              lead_id="LEAD-001",
              title="Digital Business Project",
              description="Test sales opportunity",
              value=10000,
          )

          assert opportunity.status == SalesStatus.NEW

          sales.qualify("OPP-001")
          sales.create_proposal("OPP-001")
          sales.start_negotiation("OPP-001")
          sales.mark_won("OPP-001", customer_id="CUSTOMER-001")

          assert sales.get_opportunity("OPP-001").status == SalesStatus.WON

          customers = CustomerBusinessEngine()

          customer = customers.create_customer(
              customer_id="CUSTOMER-001",
              name="Test Customer",
              email="customer@example.com",
              phone="+910000000000",
              organization="TEST BUSINESS",
              source_opportunity_id="OPP-001",
          )

          assert customer.status.value == "ACTIVE"

          work_engine = WorkBusinessEngine(platform_fee_rate=0.10)

          work = work_engine.create_work(
              work_id="WORK-001",
              client_id="CUSTOMER-001",
              title="Test Work",
              description="Test freelancer work",
              budget=10000,
          )

          assert work.status == WorkStatus.POSTED

          work_engine.assign_freelancer(
              work_id="WORK-001",
              freelancer_id="FREELANCER-001",
              ai_assist_allowed=True,
              human_review_required=True,
          )

          work_engine.start_work("WORK-001")
          work_engine.submit_for_review("WORK-001")
          work_engine.deliver("WORK-001")
          work_engine.approve("WORK-001")

          assert work_engine.get_work("WORK-001").status == WorkStatus.APPROVED

          payment = work_engine.create_payment(
              payment_id="PAYMENT-001",
              work_id="WORK-001",
          )

          assert payment.gross_amount == 10000
          assert payment.platform_fee == 1000
          assert payment.freelancer_amount == 9000
          assert payment.status == PaymentStatus.PENDING

          work_engine.authorize_payment("PAYMENT-001")
          work_engine.mark_payment_held("PAYMENT-001")
          work_engine.release_payment("PAYMENT-001")

          assert work_engine.payments["PAYMENT-001"].status == PaymentStatus.RELEASED

          print("BUSINESS FLOW TEST PASSED")
          PY

      - name: Run business API integration test
        run: |
          python - <<'PY'
          from backend.api.businesses import (
              BusinessCreateRequest,
              BusinessStatusRequest,
              controller,
              create_business,
              get_business,
              get_businesses,
              update_business_status,
              verify_business,
              delete_business,
          )

          controller.service.businesses.clear()

          created = create_business(
              BusinessCreateRequest(
                  owner_id="OWNER-001",
                  name="API TEST BUSINESS",
                  category="DIGITAL SERVICES",
                  location="JAIPUR",
                  website="https://example.com",
                  public_contact="api-test@example.com",
                  source="PUBLIC_BUSINESS_DATA",
              )
          )

          business_id = created["data"]["business_id"]

          assert business_id == "BUS-000001"
          assert created["data"]["name"] == "API TEST BUSINESS"

          fetched = get_business(business_id)

          assert fetched["data"]["business_id"] == business_id

          listing = get_businesses()

          assert listing["count"] == 1

          verified = verify_business(business_id)

          assert verified["data"]["verified"] is True

          updated = update_business_status(
              business_id,
              BusinessStatusRequest(status="ACTIVE"),
          )

          assert updated["data"]["status"] == "ACTIVE"

          deleted = delete_business(business_id)

          assert deleted["deleted"] is True

          missing = get_business(business_id)

          assert missing["data"] is None

          print("BUSINESS API TEST PASSED")
          PY
